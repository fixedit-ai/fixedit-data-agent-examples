# Global Telegraf Agent Configuration

[agent]
  # Collection interval. The CPU plugin needs two samples before it can
  # report a percentage, so the first overlay update arrives after about
  # two intervals.
  interval = "${SYNC_INTERVAL_SECONDS:-10}s"

  # Maximum time an output holds metrics before writing them.
  flush_interval = "${FLUSH_INTERVAL_SECONDS:-10}s"

  # Enable debug logging when the FixedIT Data Agent sets this variable.
  debug = ${TELEGRAF_DEBUG:-false}
