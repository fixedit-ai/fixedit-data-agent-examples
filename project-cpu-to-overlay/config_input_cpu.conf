# Sample total CPU usage.
#
# usage_active is the non-idle share of CPU time over the collection
# interval, as a percentage from 0 to 100. It includes iowait.
# percpu is off so only the cpu-total series is collected.
#
# name_override keeps this measurement separate from the bundled
# inputs.cpu config, which also uses the measurement name "cpu".

[[inputs.cpu]]
  name_override = "cpu_sample"
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true
