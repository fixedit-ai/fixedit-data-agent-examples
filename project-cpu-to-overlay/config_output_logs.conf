# Print the CPU percentage in the FixedIT Data Agent Logs tab.
#
# stdout is captured by the Data Agent and shown under Logs -> Pipeline Data.

[[outputs.file]]
  namepass = ["cpu_sample"]
  files = ["stdout"]
  data_format = "template"
  template = "cpu_sample usage_active={{ printf \"%.0f\" (.Field \"usage_active\") }}\n"
  metric_batch_size = 1
