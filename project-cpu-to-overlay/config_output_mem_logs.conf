# Print the memory percentage in the FixedIT Data Agent Logs tab.
#
# stdout is captured by the Data Agent and shown under Logs -> Pipeline Data.

[[outputs.file]]
  namepass = ["mem_sample"]
  files = ["stdout"]
  data_format = "template"
  template = "mem_sample used_percent={{ printf \"%.0f\" (.Field \"used_percent\") }}\n"
  metric_batch_size = 1
