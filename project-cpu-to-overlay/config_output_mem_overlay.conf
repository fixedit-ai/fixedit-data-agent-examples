# Write the memory percentage to dynamic overlay modifier #D2.
#
# set_overlay_text.sh reads one line per update: "<template_id> <text>".
# Template id 2 is modifier #D2, so it does not overwrite the CPU graph
# on #D1. The text is used_percent rounded to a whole number, for
# example "63". The camera text overlay must include #D2.
#
# Environment variables:
#   HELPER_FILES_DIR: set by the FixedIT Data Agent to the helper-file directory
#   VAPIX_USERNAME, VAPIX_PASSWORD: camera account with operator permission
#   CAMERA_IP: optional, default 127.0.0.1

[[outputs.exec]]
  namepass = ["mem_sample"]
  command = ["${HELPER_FILES_DIR}/set_overlay_text.sh"]
  data_format = "template"
  template = "2 {{ printf \"%.0f\" (.Field \"used_percent\") }}\n"
  use_batch_format = false
  metric_batch_size = 1
  metric_buffer_limit = 2
  timeout = "10s"
