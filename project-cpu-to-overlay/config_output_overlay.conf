# Write the CPU percentage to a dynamic overlay modifier, #D1 by default.
#
# set_overlay_text.sh reads one line per update: "<template_id> <text>".
# The template id comes from OVERLAY_TEMPLATE_ID, where 1 is #D1, 2 is #D2,
# and so on. The text is usage_active rounded to a whole number, for
# example "42". The camera text overlay must include the same modifier.
#
# Environment variables:
#   HELPER_FILES_DIR: set by the FixedIT Data Agent to the helper-file directory
#   VAPIX_USERNAME, VAPIX_PASSWORD: camera account with operator permission
#   CAMERA_IP: optional, default 127.0.0.1
#   OVERLAY_TEMPLATE_ID: optional, default 1 (#D1)

[[outputs.exec]]
  namepass = ["cpu_sample"]
  command = ["${HELPER_FILES_DIR}/set_overlay_text.sh"]
  data_format = "template"
  template = "${OVERLAY_TEMPLATE_ID:-1} {{ printf \"%.0f\" (.Field \"usage_active\") }}\n"
  use_batch_format = false
  metric_batch_size = 1
  metric_buffer_limit = 2
  timeout = "10s"
