# This section configures global settings for Telegraf.
# For more details about global configuration, read at:
# https://docs.influxdata.com/telegraf/v1/configuration/#agent-configuration
[agent]

# The default interval at which metrics are collected. Set from the
# ${SYNC_INTERVAL_SECONDS} environment variable, which the FixedIT Data Agent
# provides. Configure this interval from the Configuration->Variables tab and
# the "Basic environment variables" section in the FixedIT Data Agent.
interval = "${SYNC_INTERVAL_SECONDS}s"

# The flush interval that decides the maximum time that an output
# might hold the data before writing it. It's mostly useful for remote
# outputs that support batching to improve efficiency.
# This interval can be configured from the Configuration->Variables tab
# and the "Basic environment variables" section in the FixedIT Data Agent.
flush_interval = "${FLUSH_INTERVAL_SECONDS}s"

# The number of metrics that outputs should wait for before they
# flush. Setting this to 1 will flush each metric directly as it
# arrives, i.e. ignoring the flush interval.
# To change this variable, add a new "Extra Telegraf Variable" named
# "METRIC_BATCH_SIZE" in the Configuration->Variables tab in the
# FixedIT Data Agent. Defaults to 1 if not set.
metric_batch_size = ${METRIC_BATCH_SIZE:-1}

# The maximum number of metrics that an output may hold before
# starting to drop metrics. If the metric batch size is larger than
# this value, then metrics will be dropped if this limit is reached
# before the flush interval is reached. This is mostly useful for
# output plugins that might be blocked, like remote API calls.
# To change this variable, add a new "Extra Telegraf Variable" named
# "METRIC_BUFFER_LIMIT" in the Configuration->Variables tab in the
# FixedIT Data Agent. Defaults to 1000 if not set.
metric_buffer_limit = ${METRIC_BUFFER_LIMIT:-1000}

# The debug mode (true/false) which controls the verbosity of Telegraf.
# This is set by the FixedIT Data Agent based on the "Verbose debug
# mode" slider in the Configuration->Variables tab and the "Basic
# environment variables" section.
# Enabling this will produce more verbose logging from Telegraf which
# will be visible in the "Logs->Diagnostics" tab of the FixedIT Data Agent.
debug = ${TELEGRAF_DEBUG:-true}


# This section defines the first input. Every collection interval (controlled
# by the global 'interval' setting) this will produce a metric using the
# "exec" input plugin. The command output becomes the metric value.
# Read more about the exec input plugin here:
# https://github.com/influxdata/telegraf/tree/master/plugins/inputs/exec
[[inputs.exec]]
  # Command to execute for metric collection
  commands = ["echo 'Hello, World! (Global Interval)'"]

  # Data format to consume. This tells Telegraf which parser to use
  # to interpret the output of the command. In this case, the output
  # is a simple string that we want to collect as is.
  data_format = "value"
  data_type = "string"

  # Override the default metric name. Without name_override, Telegraf uses
  # the plugin name as the measurement name.
  name_override = "hello_world_global"

# This section defines another input. This input also produces metrics on
# each collection interval, but overrides the global interval with a shorter
# value for more frequent collection.
[[inputs.exec]]
  # Command to execute for metric collection
  commands = ["echo 'Hello, World! (5s Override Interval)'"]

  # Override global interval for more frequent execution
  interval = "5s"

  # Data format to consume. This tells Telegraf which parser to use
  # to interpret the output of the command. In this case, the output
  # is a simple string that we want to collect as is.
  data_format = "value"
  data_type = "string"

  # Override the default metric name. Without name_override, Telegraf uses
  # the plugin name as the measurement name.
  name_override = "hello_world_override"


# This section defines an output that will print all collected metrics
# to the standard output of the Telegraf process. The standard output
# is then collected by the FixedIT Data Agent and displayed in the
# "Logs->Pipeline Data" tab.
# Read more about the file output plugin here:
# https://github.com/influxdata/telegraf/tree/master/plugins/outputs/file
[[outputs.file]]
  # Files to write to, "stdout" is a specially handled file.
  files = ["stdout"]

  # Specifies the output format to use. The JSON includes the field
  # values plus metadata such as the timestamp, measurement name,
  # and tags added by Telegraf.
  data_format = "json"
