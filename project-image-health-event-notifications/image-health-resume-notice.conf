# Tell the user when paused image health notifications start flowing
# again, and how many activations were held back while they were paused.
#
# image-health-to-ntfy.conf sends one "notifications paused" message when
# a cause flickers, then stays silent for that cause until it has been
# quiet for ALARM_QUIET_PERIOD. Without this file, nothing marks the end
# of that silence: a reader of the log sees "paused" and then nothing,
# and cannot tell a healthy camera from a muted one.
#
# Load this file AFTER image-health-to-ntfy.conf. It reads the
# incident_sum field that the cumulative_sum processor in that file adds,
# and the 1 s health_event_expiry_tick metric that drives its expiry.
#
# Uses the same extra env as image-health-to-ntfy.conf:
#   NTFY_TOPIC_URL=https://ntfy.sh/your-topic
#   ALARM_QUIET_PERIOD=1h
#   NOTIFY_MAX_BEFORE_PAUSE=5

[[processors.starlark]]
  namepass = ["health_event_activated", "health_event_expiry_tick"]

  source = '''
load("time.star", "time")

QUIET = time.parse_duration(quiet_period)
LAYOUT = "2006-01-02T15:04:05Z07:00"

# One entry per paused counter. cumulative_sum keeps one counter per
# metric name and full tag set, so the key is the full tag set, not just
# the Cause tag.
#   tags:       the tags to put on the resume notice
#   since:      when the first held-back activation arrived
#   last:       when the latest activation arrived
#   suppressed: activations that were not sent
#   due:        the quiet period had already passed at the previous tick
state = {"paused": {}}

def resumed(p, now):
    m = Metric("health_event_notifications_resumed")
    for k, v in p["tags"]:
        m.tags[k] = v
    m.fields["paused_at"] = p["since"].format(LAYOUT)
    m.fields["resumed_at"] = now.format(LAYOUT)
    m.fields["paused_seconds"] = int((now - p["since"]).seconds)
    m.fields["suppressed"] = p["suppressed"]
    return m

def apply(metric):
    now = time.now()
    out = [metric]
    paused = state["paused"]

    if metric.name == "health_event_activated":
        key = tuple(sorted(metric.tags.items()))
        p = paused.get(key)
        if metric.fields.get("incident_sum", 0) > max_before_pause:
            # Not sent by image-health-to-ntfy.conf. The first one is
            # the activation that triggers the "paused" message.
            if p == None:
                p = {"tags": key, "since": now, "suppressed": 0}
                paused[key] = p
            p["suppressed"] += 1
            p["last"] = now
            p["due"] = False
        elif p != None:
            # The counter was reset and this activation is being sent,
            # so notifications are already flowing again. This only
            # happens if an activation lands in the tick before the
            # timer below fires.
            out.append(resumed(p, now))
            paused.pop(key)
        return out

    # health_event_expiry_tick, once a second. cumulative_sum resets a
    # cause's counter on the first tick after ALARM_QUIET_PERIOD with no
    # activation. Waiting one more tick before announcing the resume makes
    # sure the reset has happened, so the next activation really is sent.
    # A quiet period of zero turns expiry off in cumulative_sum, so a
    # pause never ends and no resume is sent.
    if QUIET <= time.parse_duration("0s"):
        return out
    for key, p in list(paused.items()):
        if now - p["last"] > QUIET:
            if p["due"]:
                out.append(resumed(p, now))
                paused.pop(key)
            else:
                p["due"] = True
    return out
'''

  # Read by the script above. Same values as image-health-to-ntfy.conf.
  [processors.starlark.constants]
    quiet_period = "${ALARM_QUIET_PERIOD:-1h}"
    max_before_pause = ${NOTIFY_MAX_BEFORE_PAUSE:-5}

# Print the resume to stdout (the Data Agent Logs tab).
[[outputs.file]]
  namepass = ["health_event_notifications_resumed"]
  files = ["stdout"]
  data_format = "template"
  metric_batch_size = 1
  template = '''
------------------------------------------------------------
Image health notifications resumed
  cause:    {{ .Tag "Cause" }}
  paused:   {{ .Field "paused_at" }} to {{ .Field "resumed_at" }}
  not sent: {{ .Field "suppressed" }} activations
------------------------------------------------------------
'''

# Send the resume to ntfy, so the pause and its end sit next to each
# other in the same notification history.
[[outputs.http]]
  namepass = ["health_event_notifications_resumed"]
  url = "${NTFY_TOPIC_URL}"
  method = "POST"
  timeout = "10s"
  data_format = "template"
  use_batch_format = false
  metric_batch_size = 1
  template = '{{ .Tag "Cause" }} alarm notifications resumed. Paused {{ .Field "paused_at" }} to {{ .Field "resumed_at" }}, {{ .Field "suppressed" }} activations not sent.'
  [outputs.http.headers]
    Content-Type = "text/plain; charset=utf-8"
    Title = "Image health notifications resumed"
    Tags = "camera"
    Priority = "default"
