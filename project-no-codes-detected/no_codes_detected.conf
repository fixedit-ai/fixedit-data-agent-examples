# Watch a conveyor for QR codes from the FixedIT QR Code Decoder.
# If no QR-Code event arrives for a set time, produce a stateful Axis event
# with active=true. The next QR-Code event sets active=false.
#
# Requires the FixedIT QR Code Decoder ACAP on the same device.
#
# Environment variables:
# - NO_CODE_GAP_MS: Heartbeat interval in milliseconds (default 1000).
#   One full interval with no CodeDecodedEvent sets the alert active.

[agent]
  # Enable debug logging when the FixedIT Data Agent sets this variable.
  debug = ${TELEGRAF_DEBUG:-false}

  # Cap the in-memory queue if the event output cannot keep up.
  metric_buffer_limit = 100

# Subscribe to FixedIT QR Code Decoder AxEvents (CodeDecodedEvent).
# Every code the decoder publishes counts. value is the decoded payload.
[[inputs.execd]]
  command = [
    "${EXECUTABLES_DIR}/event_handler", "--subscribe", "--config-inline",
    """
    [topics]
    topic_0   = CameraApplicationPlatform
    topic_1   = BarcodeReader
    topic_2   = CodeDecodedEvent

    [settings]
    namespace = tnsaxis

    [item.value]
    data_type = string

    [item.code_type]
    data_type = string
    """
  ]
  data_format = "influx"

# Heartbeat for the empty-period check. One full interval with no code
# event sets the alert active. A code that arrives just after a heartbeat
# can make the quiet time almost two intervals before the next empty one.
# It's an approximation.
[[inputs.exec]]
  commands = [
    ["echo", "heartbeat value=1i"]
  ]
  data_format = "influx"
  interval = "${NO_CODE_GAP_MS:-1000}ms"
  name_override = "no_code_heartbeat"

# Count CodeDecodedEvent metrics since the last heartbeat.
# The first code in a period sets active=false. A heartbeat with a zero
# count sets active=true. Repeat values are not emitted.
[[processors.starlark]]
  namepass = ["no_code_heartbeat", "CodeDecodedEvent"]
  source = '''
load("logging.star", "log")

state = {
    "count": 0,
    "alert_active": None,
}

def maybe_emit(time, active):
    if state["alert_active"] != None and state["alert_active"] == active:
        return None
    state["alert_active"] = active
    alert = Metric("no_code_alert")
    alert.time = time
    alert.fields["active"] = active
    log.debug("no_code_alert active=" + str(active))
    return alert

def apply(metric):
    if metric.name == "CodeDecodedEvent":
        code_type = metric.fields.get("code_type")
        value = metric.fields.get("value")
        state["count"] += 1
        log.debug("code counted code_type=" + str(code_type) + " value=" + str(value) + " count=" + str(state["count"]))
        return maybe_emit(metric.time, False)

    if metric.name != "no_code_heartbeat":
        return None

    count = state["count"]
    state["count"] = 0
    if count > 0:
        return None
    return maybe_emit(metric.time, True)
'''

# Stateful Axis event. active stays at its last value until the next change.
[[outputs.execd]]
  namepass = ["no_code_alert"]
  data_format = "json"
  command = [
    "${EXECUTABLES_DIR}/event_handler", "--produce", "--config-inline",
    """[topics]
    nice_name = FixedIT No QR Code
    topic_0   = CameraApplicationPlatform
    topic_1   = FixedITDataAgent
    topic_2   = NoCodeDetected

    [settings]
    namespace = tnsaxis
    stateful = true

    [item.active]
    kind           = data
    data_type      = bool
    default_value  = false
  """
  ]
  metric_batch_size = 1

# Show alert changes in Logs -> Pipeline Data.
[[outputs.file]]
  namepass = ["no_code_alert"]
  files = ["stdout"]
  data_format = "json"
  metric_batch_size = 1
