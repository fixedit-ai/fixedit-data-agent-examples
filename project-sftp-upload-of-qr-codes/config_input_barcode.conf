# Subscribe to FixedIT QR Code Decoder events.
#
# The FixedIT QR Code Decoder ACAP app declares CodeDecodedEvent on the Axis event bus
# (tnsaxis:CameraApplicationPlatform/tnsaxis:BarcodeReader/tnsaxis:CodeDecodedEvent).
# event_handler --subscribe writes one Influx line per detection. The decoded payload
# item is named "value". A rename processor maps that to decoded_data so later
# stages can keep using that field name.
#
# Measurement name is overridden to barcode_reader_app so later stages keep
# the same namepass filters. Enable this config before config_process_dedup.conf.

[[inputs.execd]]
  command = [
    "${EXECUTABLES_DIR}/event_handler", "--subscribe", "--config-inline",
    """
    [topics]
    topic_0   = CameraApplicationPlatform
    topic_1   = BarcodeReader
    topic_2   = CodeDecodedEvent

    [settings]
    namespace = tnsaxis

    [item.value]
    data_type = string

    [item.code_type]
    data_type = string
    """
  ]
  data_format = "influx"
  name_override = "barcode_reader_app"

  [inputs.execd.tags]
    input_method = "event"

# Rename the "value" field to "decoded_data". This is done mostly because projects that
# are using the socket reader plugin to read QR codes will get the data in the
# "decoded_data" field. This keeps projects more compatible with each other which
# simplifies sharing of code snippets between projects.
[[processors.rename]]
  namepass = ["barcode_reader_app"]
  [[processors.rename.replace]]
    field = "value"
    dest = "decoded_data"
