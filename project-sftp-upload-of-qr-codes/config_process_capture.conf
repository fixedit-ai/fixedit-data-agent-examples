# Fetch a JPEG snapshot for each QR detection and POST it to the local snapshot listener.
#
# Before capture, sets overlay #D1 (decoded QR value) and #D2 (scanner timestamp).
#
# POSTs one JSON body: {"input_data":<trigger>,"image_data":<image json>}
# The http_listener_v2 block in this file parses that body into image_capture.
#
# Helper scripts (upload in Files tab, mark executable):
# - set_overlay_text.sh
# - axis_image_consumer.sh
#
# Optional:
# - SNAPSHOT_HTTP_PORT (default 18081; localhost-only snapshot ingest)

[[outputs.exec]]
  # Only react to "barcode_reader_app" metrics.
  namepass = ["barcode_reader_app"]

  # Execute axis_image_consumer.sh, wrap the trigger metric and image JSON,
  # and POST to the localhost snapshot listener via curl.
  # The reason we send the image over HTTP instead of using a processor.execd
  # is because that processor has a limit on the size of the stdout buffer,
  # which can be a problem if the image is large. The HTTP listener does not
  # have that limit.
  # The error handling here is:
  # - If the image capture fails, axis_image_consumer.sh writes JSON with
  #   image_base64 set to null and exits non-zero.
  # - jq rejects payloads without image_base64 and fails with no stdout.
  # - curl sends an empty body if image capture failed.
  # - The http_listener_v2 input rejects empty bodies since the parsing of the
  #   JSON fails (according to our defined schema).
  # - curl exits with non-zero status due to the 400 response code.
  # - Telegraf detects the error and retries this plugin.
  command = [
    "sh",
    "-c",
    '''
set -e

# First, read the QR code detection metric from stdin.
metric=$(cat)

# Set overlay #D1 / #D2 before JPEG capture.
decoded=$(printf '%s\n' "$metric" | jq -er '.fields.decoded_data')
printf '1 %s\n' "$decoded" | "${HELPER_FILES_DIR}/set_overlay_text.sh"

frame_ts=$(printf '%s\n' "$metric" | jq -er '.timestamp')
frame_ts=$(date -u -d "@${frame_ts}" '+%Y-%m-%dT%H:%M:%SZ')
printf '2 %s\n' "$frame_ts" | "${HELPER_FILES_DIR}/set_overlay_text.sh"

snapshot_port="${SNAPSHOT_HTTP_PORT:-18081}"
"${HELPER_FILES_DIR}/axis_image_consumer.sh" < /dev/null | jq -ec --argjson metric "$metric" \
  'select(.image_base64 != null) | {input_data: $metric, image_data: .}' | curl -sf -X POST \
  -H "Content-Type: application/json" \
  --data-binary @- \
  "http://127.0.0.1:${snapshot_port}/snapshot"
''',
  ]

  # No batching of inputs (react directly to each metric).
  use_batch_format = false
  metric_batch_size = 1

  # Send the input metric to the script in JSON format.
  data_format = "json"

  # Set a timeout for the script to run.
  timeout = "30s"

  # Limit number of metrics to buffer in memory. This prevents us from
  # falling too far behind, but still make sure that we buffer enough
  # metrics to avoid losing data if there are short outages.
  metric_buffer_limit = 2

# Re-ingest the POST body from the capture command above.
# Bound to 127.0.0.1 so the listener does not need authentication.
[[inputs.http_listener_v2]]
  service_address = "127.0.0.1:${SNAPSHOT_HTTP_PORT:-18081}"
  paths = ["/snapshot"]
  methods = ["POST"]
  data_source = "body"
  data_format = "json_v2"
  name_override = "image_capture"
  read_timeout = "30s"
  write_timeout = "30s"
  max_body_size = "16MiB"

  [[inputs.http_listener_v2.json_v2]]
    [[inputs.http_listener_v2.json_v2.field]]
      path = "input_data.fields.decoded_data"
      rename = "decoded_data"
      type = "string"
    [[inputs.http_listener_v2.json_v2.field]]
      path = "image_data.image_base64"
      rename = "image_base64"
      type = "string"
